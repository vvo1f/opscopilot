services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: opscopilot
      POSTGRES_PASSWORD: opscopilot
      POSTGRES_DB: opscopilot
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # PostGIS is only needed for the text-to-SQL module (Tier 2).
  # It stays off by default to save RAM: docker compose --profile geo up -d
  geo_db:
    image: postgis/postgis:16-3.4
    profiles: ["geo"]
    environment:
      POSTGRES_USER: geo_admin
      POSTGRES_PASSWORD: geo_admin
      POSTGRES_DB: geo
    ports:
      - "5433:5432"
    volumes:
      - geo_data:/var/lib/postgresql/data

volumes:
  db_data:
  geo_data:
