[project]
name = "opscopilot"
version = "0.1.0"
description = "LLM-based assistant for document search, extraction and business process automation"
requires-python = ">=3.11"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "psycopg[binary]>=3.1",
  "pgvector",
  "openai>=1.30",
  "python-multipart",
]

[project.optional-dependencies]
# embeddings pull in PyTorch, which is big, so they are opt-in
ml = ["sentence-transformers"]
dev = ["pytest", "httpx", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
