name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # no "ml" extra here: unit tests never load the embedding model
      - run: pip install -e ".[dev,data]"
      - run: ruff check .
      - run: pytest
